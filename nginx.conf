server {
    listen 80;
    server_name localhost;

    underscores_in_headers on;
    ignore_invalid_headers off;
    # Designer SQL posts can carry a large session cookie. The default 8k
    # buffer turns that into HTTP 431, which Stimulsoft shows as a connection error.
    large_client_header_buffers 8 128k;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        application/xml
        text/css
        text/plain
        text/xml
        image/svg+xml;

    # Runtime-generated config — must always be fetched fresh
    location = /config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # Hashed build assets — safe to cache forever
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|eot)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html — must always be revalidated so new deploys are picked up
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Stimulsoft PostgreSQL Test Connection and SQL queries. A POST that
    # falls through to the static site is rejected with 405 Not Allowed.
    location /proxy {
        proxy_pass http://127.0.0.1:9615/;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 20m;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header id_token "";
    }

    location / {
        try_files $uri /index.html;
    }

    error_page 404 /index.html;
}
